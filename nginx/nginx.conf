server {
    listen 80;
    # принимаем любой хост: localhost, IP сервера или домен (сам адрес задаётся в PUBLIC_BASE_URL)
    server_name _;

    # --- auth service: /api/auth/*  и  JWKS
    location /api/auth/ {
        proxy_pass http://auth:8000;
        proxy_http_version 1.1;
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;
    }

    location /.well-known/ {
        proxy_pass http://auth:8000;
        proxy_set_header Host $host;
    }

    # --- media service: аватар, фото и гипертекст рецептов
    # regex-location имеет приоритет над префиксным /api/db/ ниже
    location ~ ^/api/db/(me/avatar$|avatar/|image(/|$)|hyper-text(/|$)) {
        proxy_pass http://media:8000;
        proxy_http_version 1.1;
        client_max_body_size 11m;
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;
    }

    # --- recipes service: /api/db/*
    location /api/db/ {
        proxy_pass http://recipes:8000;
        proxy_http_version 1.1;
        client_max_body_size 5m;   # под загрузку аватара
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;
    }

    # Скрытая /home/ ведёт на свайпы
    location ~ ^/home(/.*)?$ { return 301 /swipe/; }

    # Статика фронта; / открывает свайпы
    location / {
        root /usr/share/nginx/html;
        index index.html;
        try_files $uri $uri/ $uri/index.html =404;
    }
}
