<!DOCTYPE html>
<html lang="ru">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>FOODTINDER - Новый пароль</title>
  <link rel="stylesheet" href="./style.css">
</head>
<body>

  <div class="div">
    
    <!-- ГЛОБАЛЬНАЯ ШАПКА -->
    <header class="header-wrapper">
      <div class="foodtinder">
        <a href="../glavnaya/index.html" class="foodtinder2">FOODTINDER</a>
      </div>
    </header>

    <!-- ЦЕНТРАЛЬНЫЙ КОНТЕНТ СТРАНИЦЫ -->
    <main class="recovery-container">
      
      <!-- ФОРМА УСТАНОВКИ НОВОГО ПАРОЛЯ -->
      <form class="recovery-form" onsubmit="return false;">
        
        <!-- Заголовок страницы -->
        <h1 class="div2">Новый пароль</h1>

        <!-- Блок поля "Пароль" -->
        <div class="input-group">
          <span class="div2-label">Пароль</span>
          <div class="rectangle-6">
            <input type="password" placeholder="Введите пароль" required>
          </div>
        </div>

        <!-- Блок поля "Подтвердите пароль" -->
        <div class="input-group">
          <span class="div3-label">Подтвердите пароль</span>
          <div class="rectangle-7">
            <input type="password" placeholder="Введите пароль еще раз" required>
          </div>
        </div>

        <!-- Кнопка "Подтвердить" -->
        <button type="submit" class="rectangle-10" style="border: none; width: 100%;">
          <span class="div4">Подтвердить</span>
        </button>

      </form>

    </main>
  </div>

  <script src="../api.js"></script>
  <script src="./new-password.js"></script>
</body>
</html>
