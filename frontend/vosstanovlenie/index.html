<!DOCTYPE html>
<html lang="ru">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Восстановление доступа — FOODTINDER</title>
  <link rel="stylesheet" href="./style.css">
</head>
<body>

  <div class="div">
    
    <!-- ГЛОБАЛЬНАЯ ШАПКА -->
    <header class="header-wrapper">
      <div class="foodtinder">
        <a href="../glavnaya/index.html" class="foodtinder2">FOODTINDER</a>
      </div>
    </header>

    <!-- ЦЕНТРАЛЬНЫЙ КОНТЕНТ СТРАНИЦЫ -->
    <main class="recovery-container">
      <h1 class="div2">Восстановление</h1>
      <form class="recovery-form" onsubmit="return false;">
        
        <!-- Поле Email -->
        <div class="input-group">
          <label class="email" for="email-input">Email</label>
          <div class="rectangle-7">
            <input type="email" id="email-input" class="email2" placeholder="Введите Email" required>
          </div>
        </div>

        <!-- Кнопка "Получить код" -->
        <button type="button" class="rectangle-72">
          <span class="div10">Получить код</span>
        </button>

        <!-- Поле Код -->
        <div class="input-group">
          <label class="div8" for="code-input">Код</label>
          <div class="rectangle-8">
            <input type="text" id="code-input" class="div9" placeholder="Введите код">
          </div>
        </div>

        <!-- Кнопка "Подтвердить" -->
        <button type="submit" class="rectangle-9">
          <span class="div11">Подтвердить</span>
        </button>

      </form>

    </main>
  </div>

</body>
</html>
