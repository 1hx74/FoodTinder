<!DOCTYPE html>
<html lang="ru">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>FOODTINDER - Восстановление доступа</title>
  <link rel="stylesheet" href="./style.css">
</head>
<body>

  <div class="div">
    
    <!-- ГЛОБАЛЬНАЯ ШАПКА -->
    <header class="header-wrapper">
      <div class="foodtinder">
        <a href="../glavnaya/index.html" class="foodtinder2">FOODTINDER</a>
      </div>
    </header>

    <!-- ЦЕНТРАЛЬНЫЙ КОНТЕНТ СТРАНИЦЫ -->
    <main class="recovery-container">
      <h1 class="div2">Восстановление</h1>
      <form class="recovery-form" onsubmit="return false;">
        
        <!-- Поле Email -->
        <div class="input-group">
          <span class="email">Email</span>
          <div class="rectangle-7">
            <input type="email" placeholder="user@mail.ru" required>
          </div>
        </div>

        <!-- Кнопка "Получить код" -->
        <div class="rectangle-72">
          <span class="div10">Получить код</span>
        </div>

        <!-- Поле Код -->
        <div class="input-group">
          <span class="div8">Код</span>
          <div class="rectangle-8">
            <input type="text" placeholder="123456" required>
          </div>
        </div>

        <!-- Кнопка "Подтвердить" -->
        <div class="rectangle-9">
          <span class="div11">Подтвердить</span>
        </div>

      </form>

    </main>
  </div>

  <script src="../api.js"></script>
  <script src="./vosstanovlenie.js"></script>
</body>
</html>
