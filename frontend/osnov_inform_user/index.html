<!DOCTYPE html>
<html lang="ru">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>FOODTINDER — Профиль</title>
  <link rel="stylesheet" href="../glavnaya/vars.css">
  <link rel="stylesheet" href="./style.css">
</head>
<body>

  <!-- Глобальный адаптивный каркас приложения из vars.css -->
  <div class="div">
    
    <!-- Глобальная шапка сайта -->
    <div class="header-wrapper">
      <div class="foodtinder">
        <a href="../glavnaya/index.html" class="foodtinder2">FOODTINDER</a>
      </div>
      <div class="frame-4">
        <div class="div3">
          <!-- ИСПРАВЛЕНО: Сюда скрипт динамически подставит имя пользователя вместо слова "Пользователь" -->
          <span class="user-text" id="header-username">Загрузка...</span>
        </div>
        <div class="frame-5">
          <img class="ellipse-2" src="../glavnaya/ellipse-20.svg" alt="Аватар">
          <!-- ИСПРАВЛЕНО: Сюда подставится первая буква имени в кружок -->
          <div class="div2" id="profile-letter">П</div>
        </div>
      </div>
    </div>

    <!-- Центральный блок формы (Полная аналогия main-content из регистрации) -->
    <div class="main-content">
      <!-- Секция большого аватара и интерактивного имени из Figma -->
      <div class="avatar-section">
        <div class="ellipse-3"></div>
        <div class="editable-name-wrapper" id="name-wrapper">
          <h2 class="div4" id="name-display">Загрузка...</h2>
          <input type="text" class="name-field-input" id="name-input" style="display: none;">
        </div>
      </div>

      <!-- Контейнер формы полностью по стилю регистрации -->
      <form class="form-container" onsubmit="event.preventDefault(); alert('Изменения сохранены!');" autocomplete="off">
        
        <form class="form-container">
          <div class="input-group">
            <span class="input-label">Email</span>
            <input type="email" id="email" class="custom-input">
          </div>

          <div class="input-group">
            <span class="input-label">День рождения</span>
            <input type="text" id="birth_date" class="custom-input" placeholder="ДД.ММ.ГГГГ">
          </div>

          <div class="input-group">
            <span class="input-label">Пол</span>
            <input type="text" id="gender" class="custom-input" placeholder="men / women">
          </div>

          <div class="input-group">
            <span class="input-label">Рост</span>
            <input type="number" id="height" class="custom-input">
          </div>

          <div class="input-group">
            <span class="input-label">Вес</span>
            <input type="number" id="weight" class="custom-input">
          </div>

          <button type="submit" class="submit-btn">
            <span class="div7">Сохранить</span>
          </button>
        </form>

        <script src="osnov_inform_user.js"></script>

    </main>
  </div>

</body>
</html>
