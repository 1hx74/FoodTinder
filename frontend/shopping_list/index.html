<!DOCTYPE html>
<html lang="ru">
<head>
  <meta charset="UTF-8">
  <meta http-equiv="X-UA-Compatible" content="IE=edge">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <link rel="stylesheet" href="/common/base.css">
  <link rel="stylesheet" href="/shopping_list/style.css">

  <style>
    a, button, input, select, h1, h2, h3, h4, h5, * {
      box-sizing: border-box;
      margin: 0;
      padding: 0;
      border: none;
      text-decoration: none;
      background: none;
      -webkit-font-smoothing: antialiased;
    }
    menu, ol, ul {
      list-style-type: none;
      margin: 0;
      padding: 0;
    }
  </style>
  <title>Список покупок</title>
  <!-- Скрываем страницу до проверки авторизации -->
  <style>
    html.auth-checking body {
      visibility: hidden;
    }
  </style>
  <!-- Проверка авторизации -->
  <script>
    document.documentElement.classList.add("auth-checking");
  </script>
  <script src="/common/api.js" defer></script>
  <script src="/common/auth-guard.js" defer></script>
</head>
<body>
  <div class="div">
    <header class="header-wrapper">
      <div class="foodtinder">
        <a href="/swipe/" class="foodtinder2">FOODTINDER</a>
      </div>
      <div class="frame-4">
        <a href="/account/" class="frame-5" style="position: relative; border-radius: 50%; overflow: hidden; display: inline-flex; align-items: center; justify-content: center;">
          <div class="ellipse-2" style="background: var(--brand-text); border-radius: 50%;"></div>
          <img id="header-avatar-img" class="header-avatar-img" src="" alt="" style="display: none;">
          <span class="div2" id="profile-letter">Г</span>
        </a>
        <div class="div3" id="auth-container">
          <a href="/login/" class="div4">Вход</a>
          <span class="slash-separator">/</span>
          <a href="/registration/" class="div4">Регистрация</a>
        </div>
      </div>
    </header>

    <main class="main-content">
      <div class="shopping-header">
        <h1 class="shopping-title">Список покупок</h1>
        <a href="/planner/" class="back-to-planner-link">Назад к планировщику</a>
      </div>

      <div class="shopping-card">
        <div class="shopping-list-body" id="shopping-list-body"></div>
        <div class="shopping-list-actions" id="shopping-list-actions" hidden>
          <button type="button" class="action-pill-btn shopping-action-btn" id="shopping-share-btn">Поделиться</button>
          <button type="button" class="action-pill-btn shopping-action-btn" id="shopping-copy-btn">Скопировать</button>
        </div>
      </div>
    </main>
  </div>

  <script src="/common/api.js"></script>
  <script src="/shopping_list/shopping_list.js"></script>
</body>
</html>
