<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta http-equiv="X-UA-Compatible" content="IE=edge">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <link rel="stylesheet" href="/home/style.css">
  
  <style>
   a, button, input, select, h1, h2, h3, h4, h5, * {
       box-sizing: border-box;
       margin: 0;
       padding: 0;
       border: none;
       text-decoration: none;
       background: none;
       -webkit-font-smoothing: antialiased;
   }
   menu, ol, ul {
       list-style-type: none;
       margin: 0;
       padding: 0;
   }
   </style>
  <title>FOODTINDER</title>
</head>
<body>
  <div class="div">
    
    <!-- 1. АДАПТИВНАЯ ШАПКА -->
    <header class="header-wrapper">
      <div class="foodtinder">
        <a href="/swipe/" class="foodtinder2">FOODTINDER</a>
      </div>
      <div class="frame-4">
        <a href="/account/" class="frame-5" style="position: relative; width: 36px; height: 36px; border-radius: 50%; overflow: hidden; display: inline-flex; align-items: center; justify-content: center;">
          <div class="ellipse-2" style="background: var(--brand-text); border-radius: 50%;"></div>
          <img id="header-avatar-img" class="header-avatar-img" src="" alt="" style="display: none;">
          <span class="div2" id="profile-letter">Г</span>
        </a>
        <div class="div3" id="auth-container">
           <a href="/login/" class="div4">Вход</a>
           <span class="slash-separator">/</span>
           <a href="/registration/" class="div4">Регистрация</a>
        </div>
      </div>
    </header>

    <!-- 2. ГЛАВНАЯ КАРТИНКА С ЕДОЙ -->
    <img class="_1-1" src="/home/hero.png" alt="Еда" />

    <!-- 3. КОНТЕНТНАЯ ЧАСТЬ (ЗАГОЛОВОК И СЕТКА КНОПОК) -->
    <main class="main-content">
      <div class="div5">Начать выбор рецептов</div>
      
            <!-- Cетка кнопок, которая сама управляет их расположением -->
      <div class="buttons-grid">
        
        <!-- Кнопка Завтрак -->
        <a href="/swipe/" class="btn-frame">
          <div class="btn-rect">
            <div class="btn-text">Завтрак</div>
          </div>
        </a>

        <!-- Кнопка Обед -->
        <a href="/swipe/" class="btn-frame">
          <div class="btn-rect">
            <div class="btn-text">Обед</div>
          </div>
        </a>

        <!-- Кнопка Ужин -->
        <a href="/swipe/" class="btn-frame">
          <div class="btn-rect">
            <div class="btn-text">Ужин</div>
          </div>
        </a>

        <!-- Кнопка Перекус -->
        <a href="/swipe/" class="btn-frame">
          <div class="btn-rect">
            <div class="btn-text">Перекус</div>
          </div>
        </a>

      </div>
    </main>

  </div>
  <script src="/common/api.js"></script>
</body>
</html>
