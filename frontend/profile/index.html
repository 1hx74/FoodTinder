<!DOCTYPE html>
<html lang="ru">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>FOODTINDER — Профиль</title>
  <link rel="stylesheet" href="/profile/style.css">
  <!-- Скрываем страницу до проверки авторизации -->
  <style>
    html.auth-checking body {
      visibility: hidden;
    }
  </style>
  <!-- Проверка авторизации -->
  <script>
    document.documentElement.classList.add("auth-checking");
  </script>
  <script src="/common/api.js" defer></script>
  <script src="/common/auth-guard.js" defer></script>
</head>
<body>
  <div class="div">
    <!-- ЕДИНАЯ ГЛОБАЛЬНАЯ ШАПКА (КАК НА СТРАНИЦЕ РЕГИСТРАЦИИ) -->
    <header class="header-wrapper">
      <div class="foodtinder">
        <a href="/swipe/" class="foodtinder2">FOODTINDER</a>
      </div>

      <div class="frame-4">
        <div class="div3" id="auth-container">
          <a href="/login/" class="div4">Вход</a>
          <span class="slash-separator">/</span>
          <a href="/registration/" class="div4">Регистрация</a>
        </div>
        <a href="/account/" class="frame-5" style="position: relative; width: 36px; height: 36px; border-radius: 50%; overflow: hidden; display: inline-flex; align-items: center; justify-content: center;">
          <div class="ellipse-2" style="background: var(--brand-text); border-radius: 50%;"></div>
          <img id="header-avatar-img" class="header-avatar-img" src="" alt="" style="display: none;">
          <span class="div2" id="profile-letter">Г</span>
        </a>
      </div>
    </header>

    <!-- ОСНОВНОЙ КОНТЕНТ ПРОФИЛЯ -->
    <main class="main-content">
      <div class="avatar-section">
        <img id="profile-avatar-img" class="ellipse-3" src="" alt="Аватар" style="object-fit: cover; cursor: pointer;">
        <input type="file" id="avatar-file-picker" accept="image/jpeg,image/png,image/webp,image/gif" style="display: none;">

        <div class="editable-name-wrapper" title="Нажмите, чтобы изменить имя">
          <h2 class="div4" id="name-display">Загрузка...</h2>
          <input type="text" id="name-input" class="name-field-input" style="display: none;" placeholder="Введите имя">
        </div>
      </div>

      <form class="form-container">
        <div class="input-group">
          <label class="input-label" for="email">Email</label>
          <input class="custom-input" type="email" id="email" placeholder="user@example.com" disabled>
        </div>

        <div class="input-group">
          <label class="input-label" for="birth_date">День рождения</label>
          <input class="custom-input" type="date" id="birth_date">
        </div>

        <div class="input-group">
          <label class="input-label" for="gender">Пол</label>
          <select class="custom-input" id="gender">
            <option value="men">Мужской</option>
            <option value="women">Женский</option>
          </select>
        </div>

        <div class="input-group">
          <label class="input-label" for="height">Рост (см)</label>
          <input class="custom-input" type="number" id="height" placeholder="180" min="50" max="250">
        </div>

        <div class="input-group">
          <label class="input-label" for="weight">Вес (кг)</label>
          <input class="custom-input" type="number" id="weight" placeholder="75" min="20" max="300">
        </div>

        <button type="submit" class="submit-btn">
          <span class="div7">Сохранить</span>
        </button>
      </form>
    </main>
  </div>

  <script src="/common/api.js"></script>
  <script src="/profile/profile.js"></script>
</body>
</html>
