<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta http-equiv="X-UA-Compatible" content="IE=edge">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <link rel="stylesheet" href="./style.css">
  
  <style>
   a, button, input, select, h1, h2, h3, h4, h5, * {
       box-sizing: border-box;
       margin: 0;
       padding: 0;
       border: none;
       text-decoration: none;
       background: none;
       -webkit-font-smoothing: antialiased;
   }
   menu, ol, ul {
       list-style-type: none;
       margin: 0;
       padding: 0;
   }
   </style>
  <title>FOODTINDER</title>
</head>
<body>
  <div class="div">
    
    <!-- 1. АДАПТИВНАЯ ШАПКА -->
    <header class="header-wrapper">
      <div class="foodtinder">
        <div class="foodtinder2">FOODTINDER</div>
      </div>
      <div class="frame-4">
        <div class="frame-5">
          <img class="ellipse-2" src="ellipse-20.svg" alt="Профиль" />
          <div class="div2">Г</div>
        </div>
        <div class="div3">
           <a href="../registration/index.html" class="div4">Вход</a>
        </div>
      </div>
    </header>

    <!-- 2. ГЛАВНАЯ КАРТИНКА С ЕДОЙ -->
    <img class="_1-1" src="_1-10.png" alt="Еда" />

    <!-- 3. КОНТЕНТНАЯ ЧАСТЬ (ЗАГОЛОВОК И СЕТКА КНОПОК) -->
    <main class="main-content">
      <div class="div5">Начать выбор рецептов</div>
      
      <!-- Cетка кнопок, которая сама управляет их расположением -->
      <div class="buttons-grid">
        
        <!-- Кнопка Завтрак -->
        <div class="btn-frame">
          <div class="btn-rect">
            <div class="btn-text">Завтрак</div>
          </div>
        </div>

        <!-- Кнопка Обед -->
        <div class="btn-frame">
          <div class="btn-rect">
            <div class="btn-text">Обед</div>
          </div>
        </div>

        <!-- Кнопка Ужин -->
        <div class="btn-frame">
          <div class="btn-rect">
            <div class="btn-text">Ужин</div>
          </div>
        </div>

        <!-- Кнопка Перекус -->
        <div class="btn-frame">
          <div class="btn-rect">
            <div class="btn-text">Перекус</div>
          </div>
        </div>

      </div>
    </main>

  </div>
</body>
</html>
