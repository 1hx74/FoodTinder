<!DOCTYPE html>
<html lang="ru">
  <head>
    <meta charset="UTF-8" />
    <meta http-equiv="X-UA-Compatible" content="IE=edge" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <link rel="stylesheet" href="../vars.css" />
    <link rel="stylesheet" href="./style.css" />

    <style>
      a, button, input, select, h1, h2, h3, h4, h5, * {
        box-sizing: border-box;
        margin: 0;
        padding: 0;
        border: none;
        text-decoration: none;
        background: none;
        -webkit-font-smoothing: antialiased;
      }
      menu, ol, ul { list-style-type: none; margin: 0; padding: 0; }
    </style>
    <title>FOODTINDER — Понравившиеся</title>
  </head>
  <body>
    <div class="div">
      <!-- ШАПКА -->
      <header class="header-wrapper">
        <div class="foodtinder">
          <a href="../glavnaya/index.html" class="foodtinder2">FOODTINDER</a>
        </div>
        <div class="frame-4">
          <a href="../katalog_vkladok/index.html" class="frame-5" style="position: relative; width: 36px; height: 36px; border-radius: 50%; overflow: hidden; display: inline-flex; align-items: center; justify-content: center;">
            <div class="ellipse-2" style="background: var(--brand-text); border-radius: 50%;"></div>
            <span class="div2" id="profile-letter">Г</span>
          </a>
          <div class="div3" id="auth-container">
            <a href="../vxod/index.html" class="div4">Вход</a>
            <span class="slash-separator">/</span>
            <a href="../registration/index.html" class="div4">Регистрация</a>
          </div>
        </div>
      </header>

      <!-- КОНТЕНТ -->
      <main class="main-content">
        <h1 class="page-title">Понравившиеся рецепты</h1>

        <div id="recipes-list" class="recipes-list"></div>

        <div id="loading-sentinel" class="loading-sentinel" style="display: none;">
          Загрузка рецептов...
        </div>

        <div id="empty-state" class="empty-state" style="display: none;">
          <div class="empty-title">Здесь пока пусто</div>
          <div class="empty-subtitle">
            Ставьте лайки на странице рецептов, чтобы не потерять их.
          </div>
          <a href="../glavnaya/index.html" class="div5" style="margin-top: 8px;">
            <span class="div6">Перейти к рецептам</span>
          </a>
        </div>
      </main>
    </div>

    <script src="../api.js"></script>
    <script src="./ponravivshiesa.js"></script>
  </body>
</html>
