<!DOCTYPE html>
<html lang="ru">
<head>
  <meta charset="UTF-8">
  <meta http-equiv="X-UA-Compatible" content="IE=edge">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <link rel="stylesheet" href="/common/base.css">
  <link rel="stylesheet" href="/authentication/auth.css">
  
  <style>
   a, button, input, select, h1, h2, h3, h4, h5, * {
       box-sizing: border-box;
       margin: 0;
       padding: 0;
       border: none;
       text-decoration: none;
       background: none;
       -webkit-font-smoothing: antialiased;
   }
   menu, ol, ul {
       list-style-type: none;
       margin: 0;
       padding: 0;
   }
   </style>
  <title>Подтверждение кода</title>
</head>
<body>
  <div class="div">
    
    <!-- 1. АДАПТИВНАЯ ГЛОБАЛЬНАЯ ШАПКА -->
    <header class="header-wrapper">
      <div class="foodtinder">
        <a href="/swipe/" class="foodtinder2">FOODTINDER</a>
      </div>
      <div class="frame-4">
        <div class="frame-5">
          <img class="ellipse-2" src="/common/default-avatar.svg" alt="Профиль" />
          <div class="div2" id="profile-letter">Г</div>
        </div>
        <div class="div3" id="auth-container">
           <a href="/login/" class="div4">Вход</a>
           <span class="slash-separator">/</span>
           <a href="/registration/" class="div4">Регистрация</a>
        </div>
      </div>
    </header>

    <!-- 2. ЦЕНТРАЛЬНЫЙ КОНТЕНТНЫЙ БЛОК ФОРМЫ ВЕРИФИКАЦИИ -->
    <main class="main-content">
      <h2 class="form-title" id="auth-form-title">Подтвердите регистрацию</h2>
      
      <form class="form-container">
        <!-- Поле ввода кода подтверждения -->
        <div class="input-group">
          <label class="input-label">Код</label>
          <input type="text" id="verification_code" class="custom-input" placeholder="Введите код, который прислали на почту" required />
        </div>

        <!-- Кнопка подтверждения -->
        <button type="submit" class="submit-btn" id="auth-submit-btn">
          <span>Зарегистрироваться</span>
        </button>

        <!-- Кнопка повторной отправки кода с таймером на 60 секунд -->
        <button type="button" class="resend-btn" id="resend-code-btn" disabled>
          Отправить код ещё раз (60 с)
        </button>
      </form>
    </main>

  </div>

  <script src="/common/api.js"></script>
  <script src="/authentication/auth.js"></script>
</body>
</html>
