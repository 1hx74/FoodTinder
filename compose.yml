services:
  postgres:
    image: postgres:16-alpine
    container_name: food-tinder-db
    restart: unless-stopped
    env_file:
      - ./db/.env
    ports:
      - "5432:5432"
    volumes:
      - pgdata:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U $$POSTGRES_USER -d $$POSTGRES_DB"]
      interval: 5s
      timeout: 5s
      retries: 5
    networks:
      - food-tinder-net

  auth:
    build:
      context: .
      dockerfile: ./auth/.dockerfile
    container_name: food-tinder-auth
    restart: unless-stopped
    env_file:
      - ./auth/.env
    ports:
      - "8000:8000"
    depends_on:
      postgres:
        condition: service_healthy
    networks:
      - food-tinder-net

volumes:
  pgdata:

networks:
  food-tinder-net:
    driver: bridge