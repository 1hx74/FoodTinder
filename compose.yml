services:
  postgres:
    image: postgres:16-alpine
    container_name: ft-db
    restart: unless-stopped
    env_file:
      - ./db/.env
    volumes:
      - pgdata:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U $$POSTGRES_USER -d $$POSTGRES_DB"]
      interval: 5s
      timeout: 5s
      retries: 5
    networks:
      - food-tinder-net

  auth:
    build:
      context: ./backend/auth
      dockerfile: .dockerfile
    container_name: ft-auth
    restart: unless-stopped
    env_file:
      - ./backend/auth/.env
    environment:
      JWT_PRIVATE_KEY_PATH: /run/secrets/jwt_private_key
    secrets:
      - jwt_private_key
    ports:
      - "8080:8000"
    depends_on:
      postgres:
        condition: service_healthy
    networks:
      - food-tinder-net

  recipes:
    build:
      context: ./backend/recipes
      dockerfile: .dockerfile
    restart: unless-stopped
    container_name: ft-recipes
    env_file:
      - ./backend/recipes/.env
    ports:
      - "8000:8000"
    depends_on:
      postgres:
        condition: service_healthy
    networks:
      - food-tinder-net

  nginx:
    image: nginx:1.27-alpine
    container_name: ft-nginx
    restart: unless-stopped
    ports:
      - "80:80"
    volumes:
      - ./nginx/nginx.conf:/etc/nginx/conf.d/default.conf:ro
      - ./frontend:/usr/share/nginx/html:ro
    depends_on:
      - auth
      - recipes
    networks:
      - food-tinder-net


volumes:
  pgdata:

networks:
  food-tinder-net:
    driver: bridge

secrets:
  jwt_private_key:
    file: ./backend/auth/secrets/jwt_private.pem