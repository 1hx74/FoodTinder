services:
  postgres:
    image: postgres:16-alpine
    container_name: food-tinder-db
    restart: unless-stopped
    env_file:
      - ./db/.env
    volumes:
      - pgdata:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U $$POSTGRES_USER -d $$POSTGRES_DB"]
      interval: 5s
      timeout: 5s
      retries: 5
    networks:
      - food-tinder-net

  auth:
    build:
      context: .
      dockerfile: ./auth/.dockerfile
    container_name: food-tinder-auth
    restart: unless-stopped
    env_file:
      - ./auth/.env
    expose:
      - "8000"
    depends_on:
      postgres:
        condition: service_healthy
    networks:
      - food-tinder-net

  web:
    build:
      context: .
      dockerfile: ./web/.dockerfile
    container_name: food-tinder-web
    restart: unless-stopped
    env_file:
      - ./web/.env
    expose:
      - "8000"
    depends_on:
      postgres:
        condition: service_healthy
    networks:
      - food-tinder-net

  nginx:
    image: nginx:alpine
    container_name: food-tinder-nginx
    restart: unless-stopped
    ports:
      - "80:80"
    volumes:
      - ./nginx/nginx.conf:/etc/nginx/conf.d/default.conf:ro
    depends_on:
      - web
      - auth
    networks:
      - food-tinder-net

  fileloud:
    build:
      context: .
      dockerfile: ./fileloud/.dockerfile
    container_name: food-tinder-fileloud
    ports:
      - "8001:8000"
    env_file:
      - ./fileloud/.env
    depends_on:
      - minio

    networks:
      - food-tinder-net


  minio:
    image: docker.io/pgsty/silo:RELEASE.2026-09-03T13-18-01Z
    ports:
      - "9000:9000"
      - "9001:9001"
    environment:
      - MINIO_ROOT_USER=supersecretadmin
      - MINIO_ROOT_PASSWORD=supersecretpassword
    volumes:
      - minio_data:/data
    command: server /data --console-address ":9001"
    networks:
      - food-tinder-net

volumes:
  pgdata:
  minio_data:

networks:
  food-tinder-net:
    driver: bridge
