services:
  postgres:
    image: postgres:16-alpine
    container_name: ft-db
    restart: unless-stopped
    env_file:
      - ./db/.env
    volumes:
      - pgdata:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U $$POSTGRES_USER -d $$POSTGRES_DB"]
      interval: 5s
      timeout: 5s
      retries: 5
    networks:
      - food-tinder-net

  auth:
    build:
      context: ./backend/auth
      dockerfile: .dockerfile
    container_name: ft-auth
    restart: unless-stopped
    env_file:
      - ./backend/auth/.env
    environment:
      JWT_PRIVATE_KEY_PATH: /run/secrets/jwt_private_key
    secrets:
      - jwt_private_key
    ports:
      - "8080:8000"
    depends_on:
      postgres:
        condition: service_healthy
    networks:
      - food-tinder-net

  recipes:
    build:
      context: ./backend/recipes
      dockerfile: .dockerfile
    restart: unless-stopped
    container_name: ft-recipes
    env_file:
      - ./backend/recipes/.env
    ports:
      - "8000:8000"
    depends_on:
      postgres:
        condition: service_healthy
    networks:
      - food-tinder-net

  fileloud:
    build:
      context: ./backend/fileloud
      dockerfile: .dockerfile
    container_name: ft-fileloud
    restart: unless-stopped
    env_file:
      - ./backend/fileloud/.env
    # только localhost хоста (для /docs), из сети недоступен;
    # снаружи файлы отдаются через сервис media
    ports:
      - "127.0.0.1:8001:8000"
    volumes:
      - fileloud_data:/data
    depends_on:
      - minio
    networks:
      - food-tinder-net

  minio:
    image: docker.io/pgsty/silo:RELEASE.2026-09-03T13-18-01Z
    container_name: ft-minio
    restart: unless-stopped
    # наружу не публикуем: S3 нужен только fileloud внутри docker-сети
    expose:
      - "9000"
      - "9001"
    environment:
      - MINIO_ROOT_USER=supersecretadmin
      - MINIO_ROOT_PASSWORD=supersecretpassword
    volumes:
      - minio_data:/data
    command: server /data --console-address ":9001"
    networks:
      - food-tinder-net

  media:
    build:
      context: ./backend/media
      dockerfile: .dockerfile
    container_name: ft-media
    restart: unless-stopped
    env_file:
      - ./backend/media/.env
    environment:
      # задаётся в одном месте — в .env в корне проекта
      PUBLIC_BASE_URL: ${PUBLIC_BASE_URL:-http://localhost}
    # только localhost хоста (для /docs); снаружи — через nginx
    ports:
      - "127.0.0.1:8002:8000"
    depends_on:
      postgres:
        condition: service_healthy
      fileloud:
        condition: service_started
    networks:
      - food-tinder-net

  nginx:
    image: nginx:1.27-alpine
    container_name: ft-nginx
    restart: unless-stopped
    ports:
      - "80:80"
    volumes:
      - ./nginx/nginx.conf:/etc/nginx/conf.d/default.conf:ro
      - ./frontend:/usr/share/nginx/html:ro
    depends_on:
      - auth
      - recipes
      - media
    networks:
      - food-tinder-net


volumes:
  pgdata:
  minio_data:
  fileloud_data:

networks:
  food-tinder-net:
    driver: bridge

secrets:
  jwt_private_key:
    file: ./backend/auth/secrets/jwt_private.pem