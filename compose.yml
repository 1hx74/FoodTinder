services:
  postgres:
    image: postgres:16-alpine
    container_name: food-tinder-db
    restart: unless-stopped
    env_file:
      - ./db/.env
    volumes:
      - pgdata:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U $$POSTGRES_USER -d $$POSTGRES_DB"]
      interval: 5s
      timeout: 5s
      retries: 5
    networks:
      - food-tinder-net


