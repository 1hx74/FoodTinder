  #     postgres:
  #       condition: service_healthy
  #   networks:
  #     - food-tinder-net

  recipes:
    build:
      context: .
      dockerfile: ./backend/recipes/.dockerfile
    restart: unless-stopped
    env_file:
      - ./backend/recipes/.env
    ports:
      - "8000:8000"
    depends_on:
      postgres:
        condition: service_healthy
    networks:
      - food-tinder-net


volumes:
  pgdata:

networks:
  food-tinder-net:
    driver: bridge